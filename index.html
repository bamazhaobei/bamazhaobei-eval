<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>职业本科择校评估</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;background:#f5f7fa;color:#1f2937;padding:0 0 40px}
.hd{background:linear-gradient(135deg,#1f3864,#2a5298);color:#fff;padding:20px 16px;text-align:center}
.hd h1{font-size:18px;font-weight:700}
.hd p{font-size:12px;opacity:.85;margin-top:2px}
.w{max-width:640px;margin:0 auto;padding:0 12px}
.sec{background:#fff;border-radius:10px;padding:14px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.sec h2{font-size:14px;font-weight:700;color:#1f3864;margin-bottom:10px}
.g{margin-bottom:10px}
.g label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:2px}

.g input:focus,.g select:focus{border-color:#2a5298;box-shadow:0 0 0 3px rgba(42,82,152,.1)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.b{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#1f3864,#2a5298)}
.b:disabled{background:#9ca3af;cursor:not-allowed}
.ds{background:#fff7ed;border-radius:6px;padding:8px;margin-top:10px;font-size:11px;color:#92400e;line-height:1.4}

.rh{padding:10px 14px;background:#eef2ff;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center}
.rh h3{font-size:13px;color:#1f3864}
.sc{padding:10px 14px;border-bottom:1px solid #e5e7eb}
.sc:last-child{border-bottom:none;border-radius:0 0 10px 10px}
.s1{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.sn{font-size:13px;font-weight:700}
.sv{font-size:13px;font-weight:800}
.sg{color:#059669}
.sm{color:#d97706}
.sb{color:#dc2626}
.s2{display:flex;flex-wrap:wrap;gap:2px 6px;margin-bottom:2px}
.tg{font-size:10px;padding:1px 6px;border-radius:3px;background:#e5e7eb;color:#4b5563;display:inline-block}
.s3{font-size:10px;color:#6b7280}
.smt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.si{text-align:center;padding:8px;border-radius:6px}
.si .n{font-size:20px;font-weight:800}

.ft{text-align:center;padding:12px;font-size:10px;color:#9ca3af;line-height:1.5}
.em{text-align:center;padding:24px;color:#9ca3af;font-size:13px}
</style>
</head>
<body>
<div class="hd">
<h1>职业本科择校评估</h1>
<p>输入孩子信息 &rarr; 看哪些学校最匹配</p>
</div>
<div class="w">

<div class="sec">
<h2>基本信息</h2>
<div class="g">
<label>高考分数 <span style="color:red">*</span></label>
<input type="number" id="sc" placeholder="如 480" min="200" max="750">
</div>
<div class="r2">
<div class="g"><label>目标省份</label><select id="pr">
<option>不限</option><option>内蒙古</option><option>北京</option><option>吉林</option><option>四川</option><option>宁夏</option><option>安徽</option><option>山东</option><option>山西</option><option>广东</option><option>广西</option><option>新疆</option><option>江苏</option><option>江西</option><option>河北</option><option>河南</option><option>浙江</option><option>湖北</option><option>湖南</option><option>甘肃</option><option>福建</option><option>贵州</option><option>重庆</option><option>陕西</option><option>青海</option><option>黑龙江</option></select></div>
<div class="g"><label>目标行业</label><select id="ind"><option>不限</option><option>信息技术</option><option>智能制造</option><option>新能源汽车</option><option>航空航天</option><option>现代服务</option><option>现代农业</option><option>建筑工程</option><option>健康护理</option><option>化工材料</option><option>文旅设计</option></select></div>
</div>
<div class="r2">
<div class="g"><label>月薪目标</label><select id="inc"><option>不限</option><option>4000以下</option><option>4000-6000</option><option>6000-8000</option><option>8000-10000</option><option>10000以上</option></select></div>
<div class="g"><label>实操意愿</label><select id="prac"><option>1-不想动手</option><option>2-不太喜欢</option><option>3-一般</option><option>4-愿意动手</option><option>5-特别喜欢</option></select></div>
</div>
<div class="r2">
<div class="g"><label>考研意愿</label><select id="ex"><option>未定</option><option>一定要考研</option><option>本科毕业就工作</option></select></div>
<div class="g"><label>家庭年收入</label><select id="fi"><option>不限</option><option>5万以下</option><option>5-10万</option><option>10-20万</option><option>20万以上</option></select></div>
</div>
<button class="b" id="btn" onclick="go()">开始评估</button>
<div class="ds">基于63所公办职业本科数据。结果仅供参考，建议结合各省招生计划使用。</div>
</div>

<div id="ra" style="display:none">
<div class="sec" style="padding:0">
<div class="rh"><h3>推荐排序</h3><span id="rc" style="font-size:11px;color:#6b7280"></span></div>
<div id="rl"></div>
</div>
<div class="sec" id="ss" style="display:none"><h2>评估小结</h2><div id="scx"></div></div>
</div>

<div class="ft"><p>爸妈找北 &middot; 信息差比分数差更可怕</p></div>
</div>

<script>

学", "四川", 390, 450, "B档", "装备制造", "能源工程", 0.91, 5500, "2线"], ["兰州资源环境职业技术大学", "甘肃", 360, 420, "C档", "资源勘探", "环境工程", 0.9, 5000, "3线"], ["河北石油职业技术大学", "河北", 400, 450, "无", "石油化工", "新能源", 0.92, 5500, "3线"], ["安徽职业技术大学", "安徽", 390, 450, "无", "纺织服装", "现代服务", 0.88, 5500, "3线"], ["芜湖职业技术大学", "安徽", 400, 450, "无", "汽车制造", "智能制造", 0.9, 5500, "3线"], ["唐山工业职业技术大学", "河北", 390, 440, "无", "装备制造", "陶瓷工艺", 0.9, 5500, "3线"], ["黎明职业大学", "福建", 410, 460, "无", "服装设计", "建筑工程", 0.91, 5500, "2线"], ["山西工程科技职业大学", "山西", 380, 430, "无", "建筑工程", "测绘技术", 0.88, 5500, "3线"], ["哈尔滨职业技术大学", "黑龙江", 360, 420, "无", "装备制造", "信息技术", 0.87, 5000, "2线"], ["淄博职业技术大学", "山东", 420, 470, "无", "化工", "制药", 0.9, 5500, "3线"], ["广西农业职业技术大学", "广西", 360, 420, "无", "现代农业", "食品科学", 0.88, 5000, "3线"], ["南宁职业技术大学", "广西", 370, 430, "无", "建筑工程", "旅游管理", 0.87, 5000, "3线"], ["贵阳康养职业大学", "贵州", 360, 410, "无", "康养护理", "药学", 0.88, 5000, "3线"], ["贵州交通职业大学", "贵州", 370, 420, "B档", "交通工程", "汽车服务", 0.9, 5000, "3线"], ["柳州职业技术大学", "广西", 370, 420, "无", "机械制造", "汽车服务", 0.88, 5000, "3线"], ["长春职业技术大学", "吉林", 370, 420, "无", "装备制造", "信息技术", 0.88, 5000, "2线"], ["吉林铁道职业技术大学", "吉林", 390, 440, "无", "轨道交通", "铁道工程", 0.94, 5500, "3线"], ["贵州轻工职业大学", "贵州", 350, 400, "无", "食品加工", "包装印刷", 0.86, 5000, "3线"], ["山西文化旅游职业大学", "山西", 370, 420, "无", "文旅服务", "酒店管理", 0.85, 5500, "3线"], ["甘肃林业职业技术大学", "甘肃", 340, 390, "A档", "林业", "园林景观", 0.88, 5000, "4线"], ["铜仁职业技术大学", "贵州", 340, 390, "无", "农林", "旅游", 0.85, 5000, "4线"], ["陕西农林职业技术大学", "陕西", 360, 410, "无", "农林", "园艺", 0.86, 5000, "3线"], ["内蒙古建筑职业技术大学", "内蒙古", 360, 410, "无", "建筑工程", "道路桥梁", 0.87, 5000, "3线"], ["呼和浩特职业技术大学", "内蒙古", 350, 400, "无", "信息技术", "现代服务", 0.86, 5000, "3线"], ["酒泉职业技术大学", "甘肃", 330, 380, "无", "新能源", "现代农业", 0.85, 5000, "4线"], ["甘肃工业职业技术大学", "甘肃", 350, 400, "无", "工业制造", "矿业", 0.86, 5000, "4线"], ["兴安职业技术大学", "内蒙古", 340, 390, "无", "现代农业", "畜牧兽医", 0.85, 5000, "4线"], ["武威职业技术大学", "甘肃", 320, 370, "无", "畜牧兽医", "食品加工", 0.84, 5000, "4线"], ["青海职业技术大学", "青海", 330, 380, "无", "交通物流", "新能源", 0.83, 4500, "4线"], function go(){
  var s=parseInt(document.getElementById('sc').value);
  if(!s||s<200||s>750){alert('请填有效分数(200-750)');return}
  var btn=document.getElementById('btn');btn.disabled=true;btn.textContent='评估中...';
  setTimeout(function(){
    try{
      var pr=document.getElementById('pr').value;
      var ind=document.getElementById('ind').value;
      var inc=document.getElementById('inc').value;
      var prac=document.getElementById('prac').value;
      var ex=document.getElementById('ex').value;
      var fi=document.getElementById('fi').value;
      var res=[];
      for(var i=0;i<D.length;i++){
        var d=D[i];
        if(pr!=='不限'&&d[1]!==pr)continue;
        var t=0;
        if(s>=d[2]&&s<=d[3]){t+=30}else if(s<d[2]){t+=Math.max(0,10-(d[2]-s)/10)*3}else{t+=Math.max(0,10-(s-d[3])/10)*3}
        if(ind==='不限'){t+=12}else if(d[4]===ind||d[5]===ind||d[4].indexOf(ind.slice(0,2))>-1||d[5].indexOf(ind.slice(0,2))>-1){t+=15}else{t+=4}
        if(inc==='不限'){t+=5}else if(d[9]==='1线'&&inc>='8000-10000'){t+=5}else if(['1线','经济特区'].indexOf(d[9])>-1){t+=3.5}else{t+=2}
        if(prac==='5-特别喜欢'){t+=8}else if(prac==='4-愿意动手'){t+=6}else if(prac==='3-一般'){t+=4}else{t+=2}
        if(ex==='未定'){t+=5}else if(ex==='一定要考研'){t+=d[7]==='A档'?8:6}else{t+=10}
        if(fi==='不限'){t+=3}else if(fi==='5万以下'&&d[8]<=5000){t+=3}else{t+=2}
        var g=t>=80?'强烈推荐':(t>=60?'可选':'需谨慎');
        res.push({n:d[0],p:d[1],sc:t,gr:g,lo:d[9],tu:d[8],em:d[6],d1:d[4],d2:d[5],lv:d[7]});
      }
      res.sort(function(a,b){return b.sc-a.sc});
      var top=res.slice(0,30);
      document.getElementById('ra').style.display='block';
      document.getElementById('rc').textContent='共'+res.length+'所';
      var l=document.getElementById('rl');l.innerHTML='';
      var tc=0,oc=0,lc=0;
      for(var i=0;i<top.length;i++){
        var r=top[i];if(r.sc>=80)tc++;else if(r.sc>=60)oc++;else lc++;
        var cc=r.sc>=80?'sg':(r.sc>=60?'sm':'sb');
        var fn=r.tu>6000?'学费较高':(r.tu>=5500?'学费适中':'学费较低');
        l.innerHTML+='<div class="sc"><div class="s1"><span class="sn">'+(i+1)+'. '+r.n+'</span><span class="sv '+cc+'">'+r.sc.toFixed(1)+'分</span></div><div class="s2"><span class="tg">'+r.p+'</span><span class="tg">'+(r.lv||'')+'</span><span class="tg">就业'+r.em+'</span><span class="tg">'+fn+'</span><span class="tg">'+r.gr+'</span></div><div class="s3">'+r.d1+' / '+r.d2+' | '+r.tu+'元/年 | '+r.lo+'城市</div></div>';
      }
      document.getElementById('scx').innerHTML='<div class="smt"><div class="si" style="background:#ecfdf5"><div class="n" style="color:#065f46">'+tc+'</div><div class="l" style="color:#065f46">强烈推荐</div></div><div class="si" style="background:#fffbeb"><div class="n" style="color:#92400e">'+oc+'</div><div class="l" style="color:#92400e">可选</div></div><div class="si" style="background:#fef2f2"><div class="n" style="color:#991b1b">'+lc+'</div><div class="l" style="color:#991b1b">需谨慎</div></div></div>';
      document.getElementById('ss').style.display='block';
    }catch(e){alert('计算异常:'+e.message)}
    btn.disabled=false;btn.textContent='重新评估';
    window.scrollTo(0,document.getElementById('ra').offsetTop-5);
  },100);
}
</script>

</html>
