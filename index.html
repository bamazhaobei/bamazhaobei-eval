.bt:active{background:#1f3864}
.bt.loading{background:#9ca3af}
.ds{background:#fff7ed;border-radius:6px;padding:8px;margin-top:10px;font-size:11px;color:#92400e}

.rh h3{font-size:13px;color:#1f3864}
.sc{padding:10px 14px;border-bottom:1px solid #e5e7eb}
.sc:last-child{border-bottom:none}
.s1{display:flex;justify-content:space-between;align-items:center}
.sn{font-size:13px;font-weight:700}
.sn a{color:#1f2937;text-decoration:none}
.sv{font-size:13px;font-weight:800}
.hi{color:#059669}.mi{color:#d97706}.lo{color:#dc2626}
.s2{display:flex;flex-wrap:wrap;gap:2px 6px;margin-top:2px}
.tg{font-size:10px;padding:1px 6px;border-radius:3px;background:#e5e7eb;color:#4b5563}
.s3{font-size:10px;color:#6b7280;margin-top:2px}

.sl.on{display:block}
.sl table{width:100%;border-collapse:collapse;font-size:10px}
.sl th{background:#1f3864;color:#fff;padding:4px 3px;text-align:left;position:sticky;top:0}
.sl td{padding:3px;border-bottom:1px solid #eee}
.sl a{color:#2a5298;text-decoration:none}
#res_box{display:none}

</head>

<div class="r2">

<button class="bt" id="btn_go" type="button">开始评估</button>
<div class="ds">基于63所公办职业本科数据。22所新公示学校暂不参与评分。结果仅供参考。</div>
</div>

      if (ind === "不限") t += 12;
      else if (ind === "信息技术" && (d[5] === "信息技术" || d[5] === "电子信息" || d[5] === "人工智能" || d[6] === "信息技术" || d[6] === "电子信息")) t += 15;
      else if (ind === "智能制造" && (d[5] === "智能制造" || d[5] === "装备制造" || d[5] === "机电工程" || d[6] === "智能制造" || d[6] === "装备制造")) t += 15;
      else if (ind === "新能源汽车" && (d[5] === "新能源汽车" || d[5] === "汽车工程" || d[6] === "新能源汽车")) t += 15;
      else if (ind === "航空航天" && (d[5] === "航空工程" || d[5] === "航空航天" || d[6] === "航空工程")) t += 15;
      else if (ind === "现代农业" && (d[5] === "现代农业" || d[5] === "农业" || d[6] === "现代农业")) t += 15;
      else t += 4;
      
      // Income (5%)
      if (inc === "不限") t += 4;
      else if ((d[9] === "1线") && inc >= "8000-10000") t += 5;
      else if (d[9] === "1线") t += 4;
      else t += 2.5;
      
      // Practice (5%)
      if (prc === "5-特别喜欢") t += 5;
      else if (prc === "4-愿意动手") t += 4;
      else if (prc === "3-一般") t += 3;
      else t += 2;
      
      // Interest (8%)
      if (it === "不限") t += 6;
      else if (it === "技术研发" && (d[5].indexOf("信息") >= 0 || d[5].indexOf("技术") >= 0)) t += 8;
      else if (it === "动手制造" && (d[5].indexOf("制造") >= 0 || d[5].indexOf("装备") >= 0)) t += 8;
      else if (it === "服务沟通" && (d[5].indexOf("服务") >= 0 || d[5].indexOf("养老") >= 0)) t += 8;
      else t += 3;
      
      // Personality (5%)
      if (ps === "不限") t += 4;
      else if (ps.indexOf("动手") >= 0) t += 5;
      else if (ps.indexOf("琢磨") >= 0 && d[4] === "A档") t += 4.5;
      else t += 3;
      
      // Subject (5%)
      if (sj === "不限") t += 4;
      else if (sj === "数学/物理" && (d[5].indexOf("装备") >= 0 || d[5].indexOf("信息") >= 0 || d[5].indexOf("汽车") >= 0 || d[5].indexOf("航空") >= 0 || d[5].indexOf("化工") >= 0)) t += 5;
      else if (sj === "语文/英语" && (d[5].indexOf("服务") >= 0 || d[5].indexOf("文旅") >= 0 || d[5].indexOf("管理") >= 0)) t += 5;
      else t += 3;
      
      // Practical skill (5%)
      if (pk === "不限") t += 4;
      else if ((pk === "手工/维修" || pk === "编程/IT") && (d[4] === "A档" || d[4] === "B档")) t += 5;
      else if (pk === "手工/维修" || pk === "编程/IT") t += 3.5;
      else if (pk === "组织/管理" || pk === "沟通/表达") t += 3;
      else t += 2.5;
      
      // Exam (5%)
      if (ex === "未定") t += 3.5;
      else if (ex === "一定要考研") t += (d[4] === "A档" ? 4 : (d[4] === "B档" ? 3.5 : 2.5));
      else t += (d[4] === "A档" ? 4.5 : (d[4] === "B档" ? 4 : 3.5));
      
      // Family income (3%)
      if (fi === "不限") t += 3;
      else if (fi === "5万以下" && d[7] <= 5000) t += 3;
      else if (fi === "5万以下") t += 2;
      else t += 2.5;
      
      // Early work (3%)
      if (ew === "不限") t += 3;
      else if (ew.indexOf("是") >= 0 && d[7] <= 5500 && d[8] >= 0.92) t += 3;
      else if (ew.indexOf("是") >= 0) t += 2;
      else t += 2.5;
      
      var g = t >= 80 ? "强烈推荐" : (t >= 60 ? "可选" : "需谨慎");
      results.push([d[0], d[1], t, g, d[9], d[7], d[8], d[4], d[5], d[6]]);
    }
    
    results.sort(function(a, b) { return b[2] - a[2]; });
    var top = results.slice(0, 30);
    
    document.getElementById("res_box").style.display = "block";
    document.getElementById("txt_count").textContent = "共" + results.length + "所";
    
    var html = "";
    var tc = 0, oc = 0, lc = 0;
    for (var n = 0; n < top.length; n++) {
      var r = top[n];
      if (r[2] >= 80) tc++;
      else if (r[2] >= 60) oc++;
      else lc++;
      var cc = r[2] >= 80 ? "hi" : (r[2] >= 60 ? "mi" : "lo");
      var fn = r[5] > 6000 ? "学费偏高" : (r[5] >= 5500 ? "学费适中" : "学费较低");
      var url3 = "https://www.baidu.com/s?wd=" + encodeURIComponent(r[0]);
      html += "<div class=\"sc\"><div class=\"s1\"><span class=\"sn\"><a href=\"" + url3 + "\" target=\"_blank\">" + (n+1) + ". " + r[0] + "</a></span><span class=\"sv " + cc + "\">" + r[2].toFixed(1) + "分</span></div><div class=\"s2\"><span class=\"tg\">" + r[1] + "</span><span class=\"tg\">" + r[7] + "</span><span class=\"tg\">" + fn + "</span><span class=\"tg\">" + r[3] + "</span></div><div class=\"s3\">" + r[8] + " / " + r[9] + " | 学费" + r[5] + "元/年</div></div>";
    }
    document.getElementById("list_res").innerHTML = html;
    document.getElementById("stat_res").innerHTML = "<div class=\"si\" style=\"background:#ecfdf5\"><div class=\"n\" style=\"color:#065f46\">" + tc + "</div><div class=\"l\" style=\"color:#065f46\">强烈推荐</div></div><div class=\"si\" style=\"background:#fffbeb\"><div class=\"n\" style=\"color:#92400e\">" + oc + "</div><div class=\"l\" style=\"color:#92400e\">可选</div></div><div class=\"si\" style=\"background:#fef2f2\"><div class=\"n\" style=\"color:#991b1b\">" + lc + "</div><div class=\"l\" style=\"color:#991b1b\">需谨慎</div></div>";
    
    btn.className = "bt";
    btn.textContent = "重新评估";
  });
});
</script>
