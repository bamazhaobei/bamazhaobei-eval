<div class="g"><label>家庭年收入</label><select id="in_fam">

</div>
<button class="b" id="btn_go">开始评估</button>
<div class="ds">基于63所公办职业本科数据。结果仅供参考。</div>

var area=document.getElementById("area_result");

var tcount=document.getElementById("txt_count");
var stats=document.getElementById("stats_result");

function doEval(){
  var score=parseInt(document.getElementById("in_score").value);
  if(!score||score<200||score>750){
    errbox.style.display="block";
    errbox.innerHTML="请填写有效高考分数(200-750之间)";
    return;
  }
  errbox.style.display="none";
  
  var prov=document.getElementById("in_prov").value;
  var ind=document.getElementById("in_ind").value;
  var exam=document.getElementById("in_exam").value;
  var fam=document.getElementById("in_fam").value;
  
  btn.disabled=true;
  btn.innerHTML="评估中...";
  
  var results=[];
  var i,d;
  for(i=0;i<N;i++){
    d=D[i];
    if(prov!=="不限"&&d[1]!==prov)continue;
    var t=0;
    if(score>=d[2]&&score<=d[3]){t=30;}
    else if(score<d[2]){t=Math.max(0,10-(d[2]-score)/10)*3;}
    else{t=Math.max(0,10-(score-d[3])/10)*3;}
    if(ind==="不限"){t=t+12;}
    else if(ind==="信息技术"&&(d[4]==="信息技术"||d[5]==="信息技术"||d[6]==="电子信息"||d[6]==="人工智能"||d[6]==="通信工程"||d[6]==="物联网")){t=t+15;}
    else if(ind==="智能制造"&&(d[4]==="智能制造"||d[5]==="智能制造"||d[6].indexOf("制造")>=0||d[6].indexOf("装备")>=0)){t=t+15;}
    else if(ind==="新能源汽车"&&(d[4]==="新能源汽车"||d[4]==="汽车工程"||d[5]==="新能源汽车"||d[5]==="汽车工程")){t=t+15;}
    else if(ind==="航空航天"&&(d[4]==="航空工程"||d[5]==="航空工程"||d[6].indexOf("航空")>=0)){t=t+15;}
    else{t=t+4;}
    if(exam==="未定"){t=t+5;}
    else if(exam==="一定要考研"){t=t+(d[4]==="A档"?8:6);}
    else{t=t+10;}
    if(fam==="不限"){t=t+3;}
    else if(fam==="5万以下"&&d[8]<=5000){t=t+3;}
    else{t=t+2;}
    var g="需谨慎";
    if(t>=60)g="可选";
    if(t>=80)g="强烈推荐";
    results.push([d[0],d[1],t,g,d[9],d[8],d[6],d[4],d[5]]);
  }
  results.sort(function(a,b){return b[2]-a[2];});
  var top=results.slice(0,30);
  area.className="sec";
  tcount.innerHTML="共"+results.length+"所";
  var html="";
  var tc=0,oc=0,lc=0;
  for(i=0;i<top.length;i++){
    var r=top[i];
    if(r[2]>=80)tc++;
    else if(r[2]>=60)oc++;
    else lc++;
    var cc=r[2]>=80?"cg":(r[2]>=60?"co":"cr");
    var fn=r[6]>6000?"学费偏高":(r[6]>=5500?"学费适中":"学费较低");
    html=html+'<div class="sc"><div class="s1"><span class="sn">'+(i+1)+". "+r[0]+'</span><span class="sv '+cc+'">'+r[2].toFixed(1)+"分</span></div><div class="s2"><span class="tg">"+r[1]+'</span><span class="tg">'+r[7]+'</span><span class="tg">'+fn+'</span><span class="tg">'+r[3]+'</span></div><div class="s3">'+r[8]+" / "+r[5]+"元/年</div></div>';
  }
  list.innerHTML=html;
  stats.innerHTML='<div class="si" style="background:#ecfdf5"><div class="n" style="color:#065f46">'+tc+'</div><div class="l" style="color:#065f46">强烈推荐</div></div><div class="si" style="background:#fffbeb"><div class="n" style="color:#92400e">'+oc+'</div><div class="l" style="color:#92400e">可选</div></div><div class="si" style="background:#fef2f2"><div class="n" style="color:#991b1b">'+lc+'</div><div class="l" style="color:#991b1b">需谨慎</div></div>';
  btn.disabled=false;
  btn.innerHTML="重新评估";
}
