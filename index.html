    if (sc >= input.minScore && sc <= input.maxScore) {
        total += 30;
        details.push({name:'分数匹配',score:30,max:30,desc:'分数在学校区间内'});
    } else if (sc < input.minScore) {
        const p = Math.max(0, 10 - (input.minScore - sc) / 10) * 3;
        total += p;
        details.push({name:'分数匹配',score:p,max:30,desc:'低于最低分' + (input.minScore - sc).toFixed(0) + '分'});
    } else {
        const p = Math.max(0, 10 - (sc - input.maxScore) / 10) * 3;
        total += p;
        details.push({name:'分数匹配',score:p,max:30,desc:'超过最高分' + (sc - input.maxScore).toFixed(0) + '分'});
    }

    // 2. 行业匹配 (权重15%)
    if (input.industry === "不限") {
        total += 12; // 8*1.5
        details.push({name:'行业匹配',score:12,max:15,desc:'不限行业'});
    } else if (s[7] === input.industry || s[8] === input.industry) {
        total += 15;
        details.push({name:'行业匹配',score:15,max:15,desc:'方向匹配'});
    } else if (s[7].includes(input.industry.slice(0,2)) || s[8].includes(input.industry.slice(0,2))) {
        total += 10.5;
        details.push({name:'行业匹配',score:10.5,max:15,desc:'部分匹配'});
    } else {
        total += 4.5;
        details.push({name:'行业匹配',score:4.5,max:15,desc:'方向不同'});
    }

    // 3. 收入匹配 (权重10%)
    if (input.incomeLevel === "不限") {
        total += 8; // 8*1
        details.push({name:'收入匹配',score:8,max:10,desc:'不限收入'});
    } else if ((s[11] === "1线" || s[11] === "经济特区") && input.incomeLevel >= "8000-10000") {
        total += 9;
        details.push({name:'收入匹配',score:9,max:10,desc:'一线城市+高收入'});
    } else if (["1线","新一线","经济特区","直辖市"].includes(s[11])) {
        total += 7;
        details.push({name:'收入匹配',score:7,max:10,desc:s[11]+'城市'});
    } else {
        total += 5;
        details.push({name:'收入匹配',score:5,max:10,desc:'低线城市'});
    }

    // 4. 实操匹配 (权重10%)
    const prac = input.practice;
    const isTop = ["A档","B档"].includes(s[6]);
    if (prac === "1-完全不想动手") {
        total += 10;
        details.push({name:'实操匹配',score:10,max:10,desc:'适合理论学习'});
    } else if (prac === "5-特别喜欢动手操作") {
        const p = isTop ? 9 : 7;
        total += p;
        details.push({name:'实操匹配',score:p,max:10,desc:'喜欢实操' + (isTop ? ',学校支持强' : '')});
    } else {
        const p = isTop ? 7 : 5;
        total += p;
        details.push({name:'实操匹配',score:p,max:10,desc:isTop ? '双高学校' : '一般'});
    }

    // 5. 考研匹配 (权重10%)
    if (input.exam === "未定") {
        total += 7;
        details.push({name:'考研匹配',score:7,max:10,desc:'未定'});
    } else if (input.exam === "是-一定要考研") {
        const p = s[6] === "A档" ? 8 : (s[6] === "B档" ? 7 : 5);
        total += p;
        details.push({name:'考研匹配',score:p,max:10,desc:s[6]+'双高等级'});
    } else {
        const p = s[6] === "A档" ? 9 : (s[6] === "B档" ? 8 : 7);
        total += p;
        details.push({name:'考研匹配',score:p,max:10,desc:'就业导向'});
    }

    // 6. 校企合作匹配 (权重8%)
    const partnership = calcPartnership(s[6], s[11], s[9]);
    const partScore = partnership >= 4 ? 10 : (partnership >= 3 ? 7 : (partnership >= 2 ? 5 : 3));
    total += partScore * 0.8;
    details.push({name:'校企合作',score:(partScore*0.8).toFixed(1),max:8,desc:partnership.toFixed(1)+'分'});

    // 7. 考研通道匹配 (权重5%)
    const examPath = (["A档","B档"].includes(s[6]) ? (s[6]==="A档"?4:3) : 2) + (["华东","华南"].includes(s[2])?0.5:0);
    const epScore = examPath >= 4 ? 9 : (examPath >= 3 ? 7 : 5);
    total += epScore * 0.5;
    details.push({name:'考研通道',score:(epScore*0.5).toFixed(1),max:5,desc:examPath.toFixed(1)+'分'});

    // 8. 就业去向匹配 (权重5%)
    const empType = (s[9] >= 0.95 || s[6]==="A档") ? "优质" : (s[9] >= 0.90 || s[6]==="B档") ? "良好" : "一般";
    const empScore = empType === "优质" ? 10 : (empType === "良好" ? 8 : 6);
    total += empScore * 0.5;
    details.push({name:'就业去向',score:(empScore*0.5).toFixed(1),max:5,desc:empType});

    // 9. 城市产业配套 (权重6%)
    const cityScore = ({"1线":4.5,"经济特区":5,"直辖市":4,"2线":3.5,"3线":2.5,"4线":2,"计划单列":4})[s[11]] || 2;
    total += cityScore * 2 * 0.6;
    details.push({name:'产业配套',score:(cityScore*2*0.6).toFixed(1),max:6,desc:cityScore.toFixed(1)+'分'});

    // 10. 校友网络 (权重6%)
    const alumniBase = ({"A档":3.5,"B档":3,"C档":2.5,"无":2})[s[6]] || 2;
    const alumniBoost = ["1线","经济特区","直辖市"].includes(s[11]) ? 0.5 : 0;
    const alumniScore = Math.min(alumniBase + alumniBoost, 4.5);
    total += alumniScore * 2 * 0.6;
    details.push({name:'校友网络',score:(alumniScore*2*0.6).toFixed(1),max:6,desc:alumniScore.toFixed(1)+'分'});

    // 总分四舍五入
    total = Math.round(total * 10) / 10;

    let grade, badge;
    if (total >= 80) { grade = "⭐强烈推荐"; badge = "badge-top"; }
    else if (total >= 60) { grade = "✅可选"; badge = "badge-ok"; }
    else { grade = "⚠️需谨慎"; badge = "badge-caution"; }

    return { total, grade, badge, details, empType, partnership };
}

function calcPartnership(level, city, emp) {
    let base = {"A档":4,"B档":3.5,"C档":3,"无":2}[level] || 2;
    if (["1线","经济特区"].includes(city)) base += 0.5;
    if (emp >= 0.95) base += 0.5;
    return Math.min(base, 5);
}

function calculate() {
    const score = parseInt(document.getElementById('score').value);
    if (!score || score < 200 || score > 750) {
        alert('请填写有效的高考分数（200-750之间）');
        return;
    }

    document.getElementById('calcBtn').disabled = true;
    document.getElementById('calcBtn').textContent = '⏳ 评估中...';

    setTimeout(() => {
        const input = {
            score: score,
            minScore: 0,
            maxScore: Infinity,
            province: document.getElementById('province').value,
            industry: document.getElementById('industry').value,
            incomeLevel: document.getElementById('income').value,
            practice: document.getElementById('practice').value,
            exam: document.getElementById('exam').value
        };

        let results = [];
        for (const s of SCHOOLS) {
            if (input.province !== "不限" && s[1] !== input.province) continue;
            
            const r = scoreSchool(s, {
                ...input,
                minScore: s[3],
                maxScore: s[4]
            });
            results.push({ school: s, ...r });
        }

        results.sort((a, b) => b.total - a.total);

        // Show top results (or all if < 5)
        const topN = Math.min(results.length, 30);
        const display = results.slice(0, topN);

        document.getElementById('resultArea').style.display = 'block';
        document.getElementById('resultCount').textContent = '共' + results.length + '所学校 | 显示前' + topN + '名';

        const list = document.getElementById('resultList');
        list.innerHTML = '';

        if (display.length === 0) {
            list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>没有找到匹配的学校<br>试试扩大省份或行业范围</p></div>';
            document.getElementById('summarySection').style.display = 'none';
            document.getElementById('calcBtn').disabled = false;
            document.getElementById('calcBtn').textContent = '🔍 重新评估';
            return;
        }

        let topCount = 0, okCount = 0, lowCount = 0;
        for (const r of display) {
            if (r.total >= 80) topCount++;
            else if (r.total >= 60) okCount++;
            else lowCount++;
        }

        for (let i = 0; i < display.length; i++) {
            const r = display[i];
            const rank = i + 1;
            const scoreColorClass = r.total >= 80 ? 'score-high' : (r.total >= 60 ? 'score-mid' : 'score-low');
            const feeNote = r.school[10] > 6000 ? '⚠️学费较高' : (r.school[10] >= 5500 ? '💰适中' : '✅低');
            
            const card = document.createElement('div');
            card.className = 'school-card';
            card.innerHTML = `
                <div class="school-row1">
                    <span class="school-name">${rank}. ${r.school[0]}</span>
                    <span class="school-score ${scoreColorClass}">${r.total.toFixed(1)}分</span>
                </div>
                <div class="school-row2">
                    <span class="school-tag tag-prov">${r.school[1]}</span>
                    ${r.school[6] && r.school[6] !== "无" ? '<span class="school-tag tag-a">'+r.school[6]+'双高</span>' : ''}
                    <span class="school-tag tag-emp">就业${(r.school[9]*100).toFixed(1)}%</span>
                    <span class="school-tag tag-fee">${feeNote}</span>
                    <span class="recommend-badge ${r.badge}">${r.grade}</span>
                </div>
                <div class="school-row3">
                    优势：${r.school[7]} / ${r.school[8]} | 学费${r.school[10]}元/年 | ${r.school[11]}城市
                </div>
            `;
            list.appendChild(card);
        }

        // Summary
        const summary = document.getElementById('summaryContent');
        summary.innerHTML = `
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;">
                <div style="text-align:center;padding:12px;background:#ecfdf5;border-radius:8px;">
                    <div style="font-size:24px;font-weight:800;color:#065f46;">${topCount}</div>
                    <div style="font-size:12px;color:#065f46;">⭐强烈推荐</div>
                </div>
                <div style="text-align:center;padding:12px;background:#fffbeb;border-radius:8px;">
                    <div style="font-size:24px;font-weight:800;color:#92400e;">${okCount}</div>
                    <div style="font-size:12px;color:#92400e;">✅可选</div>
                </div>
                <div style="text-align:center;padding:12px;background:#fef2f2;border-radius:8px;">
                    <div style="font-size:24px;font-weight:800;color:#991b1b;">${lowCount}</div>
                    <div style="font-size:12px;color:#991b1b;">⚠️需谨慎</div>
                </div>
            </div>
            <div style="font-size:12px;color:#6b7280;line-height:1.6;">
                <p>💡 综合得分≥80为⭐强烈推荐，60-80为✅可选，低于60为⚠️需谨慎。</p>
                <p style="margin-top:4px;">📌 如需对比具体学校，建议截图保存后自行对比优势方向和省份。</p>
            </div>
        `;
        document.getElementById('summarySection').style.display = 'block';

        document.getElementById('calcBtn').disabled = false;
        document.getElementById('calcBtn').textContent = '🔍 重新评估';
        window.scrollTo({top: document.getElementById('resultArea').offsetTop - 10, behavior: 'smooth'});
    }, 300);
}

// Scroll-to-top button
window.addEventListener('scroll', function() {
    document.getElementById('scrollTop').style.display = window.scrollY > 600 ? 'flex' : 'none';
});
</script>
